# /etc/nginx/sites-available/blog
# Enable:  sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
# HTTPS:   sudo certbot --nginx -d blog.example.com   (adds the 443 block and HTTP→HTTPS redirect)

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    # Image uploads send several resized variants in one request.
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml application/rss+xml text/plain image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The app needs the real Host (for its CSRF/origin check) and the client IP
        # (for the login rate limit; set TRUST_PROXY=1 in .env).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
